# Light checks on pull requests into staging and release: shell scripts and workflow files only, no Gradle and
# no build. The full test, lint and build run on the staging -> release pull request (build.yml).
name: checks

on:
  pull_request:
    branches: [staging, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/ci/*.sh
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # release only takes what staging has: changes go feature branch -> staging -> release.
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Pull requests into release must come from staging
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != staging ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::release takes pull requests from staging only (this one is from $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi

  # A release is tagged v<version>, so a pull request into release needs a version that is not released yet.
  version:
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The version is new
        run: |
          version=$(scripts/ci/version.sh)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; bump VERSION_NAME in gradle.properties"
            exit 1
          fi
          echo "Releases as v$version" >> "$GITHUB_STEP_SUMMARY"
