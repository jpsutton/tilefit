# Test, lint and build the release APK on the staging -> release pull request, so a release is built once.
# The APK is unsigned here; release.yml signs that artifact and publishes it without rebuilding.
# Pull requests into staging do not run this (see checks.yml). workflow_dispatch runs it on any branch,
# for testing the build itself.
name: build

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest head of a pull request matters.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: ./gradlew test lint assembleRelease --stacktrace
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: tilefit-android
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      # R8 mapping of that APK, to decode its crash traces. release.yml publishes it with the APK.
      - uses: actions/upload-artifact@v7
        with:
          name: tilefit-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
